name: Build and Release for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发

jobs:
  version:
    runs-on: windows-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史记录，用于版本生成
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      
      - name: Set Git User
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
        
      - name: Bump version
        run: npm run release:patch
        
      - name: Get version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT
        
      - name: Push changes
        run: |
          git push
          git push --tags

  build:
    needs: version
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      
      - name: List directory before build
        run: dir
      
      - name: Build for Windows
        run: npm run pack:win
        env:
          VERSION: ${{ needs.version.outputs.new_version }}
        
      - name: List directory after build
        run: |
          echo "Current directory content:"
          dir
          echo "Release directory content (if exists):"
          dir release || echo "Release directory not found"
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: essential-notes-windows
          path: release/
          if-no-files-found: warn
  
  release:
    needs: [version, build]
    runs-on: windows-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Display structure of downloaded files
        run: dir /s
        
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          name: Release v${{ needs.version.outputs.new_version }}
          files: |
            essential-notes-windows/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
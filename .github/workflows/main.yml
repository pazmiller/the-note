name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            build_command: pack:win
            artifact_path: release/
            artifact_name: essential-notes-windows
          - os: macos-latest
            build_command: pack:mac
            artifact_path: release/
            artifact_name: essential-notes-mac
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm ci
      
      - name: List directory before build
        run: |
          pwd
          ls -la || dir
      
      - name: Build for ${{ matrix.os }}
        run: npm run ${{ matrix.build_command }}
        
      - name: List directory after build
        run: |
          echo "Current directory content:"
          ls -la || dir
          echo "Release directory content (if exists):"
          ls -la release/ || dir release/ || echo "Release directory not found"
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
  
  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Display structure of downloaded files
        run: ls -R
        
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            essential-notes-windows/**/*
            essential-notes-mac/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
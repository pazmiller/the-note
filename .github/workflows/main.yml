name: Build and Release

on:
  workflow_dispatch:  # 允许手动触发
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.set_version.outputs.VERSION }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: trunk  # 显式指定分支
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      
      # 生成唯一版本号
      - name: Set version
        id: set_version
        run: |
          $NEW_VERSION = "1.0.${{ github.run_number }}"
          echo "VERSION=$NEW_VERSION" >> $env:GITHUB_OUTPUT
          
          # 更新package.json中的版本号
          $packageJson = Get-Content -Path package.json -Raw | ConvertFrom-Json
          $packageJson.version = $NEW_VERSION
          $packageJson | ConvertTo-Json -Depth 100 | Set-Content -Path package.json
          
          # 显示更新后的版本
          echo "Updated version to $NEW_VERSION"
      
      # 不要尝试提交和推送更改，只使用更新后的package.json构建
      
      # 构建应用
      - name: Build for Windows
        run: npm run build && npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        
      - name: List directory after build
        run: |
          echo "Current directory content:"
          dir
          echo "Release directory content (if exists):"
          dir release || echo "Release directory not found"
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: essential-notes-windows
          path: release/**/*.exe
          if-no-files-found: warn
  
  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: essential-notes-windows
          path: release-files
        
      - name: Display structure of downloaded files
        run: Get-ChildItem -Path release-files -Recurse
        
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          files: release-files/**/*
          generate_release_notes: true
          draft: false
          prerelease: false